name: Claude PR Review - Missing Tests

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for exactly one concern: missing test coverage.

            Run `git diff origin/main...HEAD` to see exactly what changed in this PR.
            For every new or changed public method or unit of logic, check whether the
            diff also adds or updates a test that exercises it.

            Post your findings as a single PR comment using `gh pr comment <number> --body "..."`.
            Pass the body as one plain double-quoted string on a single line, with no
            literal newline characters in it — join separate points with "; " instead of
            line breaks. Do not use command substitution, heredocs, or `$(...)` to build
            the body, and do not put a literal newline inside the quotes — a command
            containing any of those is held for manual approval and the run will end
            without posting.
            - If you find methods or logic changes without a corresponding test, list
              each one with its file and a short description of what's untested.
            - If every change in this PR is covered by a test, post a one-line comment
              saying no missing-test issues were found.

            Do not comment on anything other than missing test coverage.
          claude_args: |
            --max-turns 10
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(gh pr comment:*)"
